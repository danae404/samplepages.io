<!DOCTYPE html>
<title>WebVTT rendering, size:50%, cue too long - should be hidden</title>
<link rel="stylesheet" type="text/css" href="ahem.css">
<style>
html { overflow:hidden }
body { margin:0 }
::cue {
    font-family: Ahem, sans-serif;
    color: green
}
</style>
<video width="320" height="180" autoplay muted loop>
    <source src="white.webm" type="video/webm">
    <source src="white.mp4" type="video/mp4">
    <track src="cue-too-long.vtt" default>
</video>
<script>
document.querySelector('track').track.mode = 'showing';
</script>
